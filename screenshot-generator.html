<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Generator - Disney+ Ad Blocker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .screenshot-container {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            background-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4CAF50;
            transition: 0.3s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
            transform: translateX(26px);
        }
        
        .domains {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
        }
        
        .domains h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .domain-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .domain-list li {
            padding: 5px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .domain-list li:last-child {
            border-bottom: none;
        }
        
        .stats {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="screenshot-container" id="popup">
        <div class="header">
            <h1>Disney+ Ad Blocker</h1>
        </div>
        
        <div class="status">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Ad Blocking Active</span>
            </div>
            
            <div class="toggle-container">
                <span>Enable Ad Blocking</span>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <div class="domains">
            <h3>Blocked Domains</h3>
            <ul class="domain-list">
                <li>pagead2.googlesyndication.com</li>
                <li>us-east-1.ads.digital.disneyadvertising.com</li>
                <li>us-west-2.ads.digital.disneyadvertising.com</li>
            </ul>
        </div>
        
        <div class="stats">
            <div>Version 1.0.1</div>
            <div>Blocks Google AdSense & Disney Ads</div>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="takeScreenshot()">Take Screenshot</button>
        <button onclick="downloadScreenshot()">Download Screenshot</button>
    </div>
    
    <script>
        function takeScreenshot() {
            html2canvas(document.getElementById('popup')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'disney-ad-blocker-screenshot.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        
        function downloadScreenshot() {
            // For manual screenshot
            alert('Please take a screenshot of the popup above using your browser\'s screenshot tool or system screenshot.');
        }
    </script>
    
    <!-- Include html2canvas for automatic screenshots -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>
</html>
